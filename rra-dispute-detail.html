search.querySelector('button').onclick=()=>{results.replaceChildren();const q=search.querySelector('input').value.trim().toLowerCase();const matches=catalog.filter(x=>loans().includes(x.associatedLoan)&&(!q||x.invoice.toLowerCase().includes(q)));if(!matches.length){results.append(node('p','No matching AHIS invoices for the associated loan(s). Use manual entry if necessary.','muted'));return}matches.forEach(x=>{const row=node('div','','rraAhisResult');row.append(node('span',x.invoice+' · FY '+x.year+' · Loan '+x.associatedLoan));const add=node('button','Associate');add.type='button';add.onclick=()=>addInvoice(x);row.append(add);results.append(row)})};
addManual.onclick=()=>addInvoice({invoice:'',year:'',invoiceDate:'',received:'',description:'',source:'Manual',associatedLoan:loans()[0]||''});
saveAssoc.onclick=()=>{if(!entries.length){alert('Associate at least one invoice.');return}if(entries.some(x=>!x.invoice||!x.year||!x.associatedLoan)){alert('Every invoice needs an invoice number, financial year, and associated loan.');return}if(entries.some(x=>!loans().includes(x.associatedLoan))){alert('An invoice is linked to a loan not associated with this request. Correct Step 2 first.');return}const before=JSON.stringify(rec.invoices||[]);rec.invoices=entries.map(x=>({...x}));if(!rec.submittedInvoices)rec.submittedInvoices=original.map(x=>({...x}));rec.ahisInvoicesValidated=true;rec.invoiceAssociationNeedsReview=false;Object.assign(rec,rec.invoices[0]);if(before!==JSON.stringify(rec.invoices))flow.history.push({when:new Date().toLocaleString(),action:'AHIS invoice associations updated',by:'LAHD Staff',comment:entries.map(x=>x.invoice+' → '+x.associatedLoan+' ('+x.source+')').join('; ')});persist();editing=false;render();};draw();host.append(form);return;
}else{edits[step].forEach(key=>{const row=node('div','','editfield');const lab=node('label',labels[key]);lab.htmlFor='rra_'+key;const inp=document.createElement(key==='description'?'textarea':'input');inp.id='rra_'+key;inp.name=key;inp.value=rec[key]||'';row.append(lab,inp);form.append(row)})}const buttons=node('div','','editbuttons');if(step===1){host.append(form);return}const cancel=node('button','Cancel');cancel.type='button';cancel.onclick=()=>{editing=false;render();paintEditor()};const save=node('button','Save Changes');save.type='submit';buttons.append(cancel,save);form.append(buttons);form.onsubmit=e=>{e.preventDefault();if(step===1){form.querySelectorAll('.rraLoanFields input').forEach(inp=>rec[inp.name]=inp.value.trim())}else if(step===2){const invoices=Array.from(form.querySelectorAll('.rraInvoiceEditCard')).map(card=>Object.fromEntries(Array.from(card.querySelectorAll('input,textarea,select[name=associatedLoan]')).map(inp=>[inp.name,inp.value.trim()])));if(invoices.some(x=>!x.invoice||!x.year)){alert('Each invoice needs an invoice number and financial year.');return}const before=JSON.stringify(rec.invoices||[]);rec.invoices=invoices;rec.invoiceAssociationNeedsReview=false;Object.assign(rec,invoices[0]);if(before!==JSON.stringify(invoices))flow.history.push({when:new Date().toLocaleString(),action:'AHIS invoice associations updated',by:'LAHD Staff',comment:invoices.map(x=>x.invoice+' → '+(x.associatedLoan||'No loan')).join('; ')});}else new FormData(form).forEach((v,k)=>rec[k]=String(v).trim());persist();editing=false;set('project',rec.project);set('loan',rec.loan);render();paintEditor()};host.append(form)}const originalRender=render;render=function(){originalRender();paintEditor()};document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{editing=false;showActivity=false;render()}));document.getElementById('back').addEventListener('click',()=>{editing=false;showActivity=false;render()});document.getElementById('next').addEventListener('click',()=>{editing=false;showActivity=false;render()});document.getElementById('documentsTab').addEventListener('click',()=>{editing=false;showActivity=false;render()});document.getElementById('activityTab').addEventListener('click',()=>{editing=false;showActivity=true;render()});document.getElementById('editStep').onclick=()=>{editing=!editing;render()};document.getElementById('actionToggle').onclick=()=>document.getElementById('actionMenu').classList.toggle('hidden');let pendingRraAction=null;
const rraModal=document.getElementById('rraActionModal');
function closeRraActionModal(){rraModal.classList.remove('open');pendingRraAction=null;}
function openRraActionModal(action,title){pendingRraAction=action;document.getElementById('actionMenu').classList.add('hidden');document.getElementById('rraModalTitle').textContent=title;document.getElementById('rraInternalComment').value='';document.getElementById('rraExternalComment').value='';const ext=document.getElementById('rraExternalField');ext.style.display=action==='supervisor'?'none':'block';document.getElementById('rraApproverField').style.display=action==='supervisor'?'block':'none';document.getElementById('rraAssignmentField').style.display=action==='supervisor'?'block':'none';document.getElementById('rraAssignedStaff').value=flow.assignedStaff||'';document.getElementById('rraApprover').value=flow.approver||'';document.getElementById('rraExternalLabel').innerHTML=action==='return'?'External Comment <span class="rraRequired">*</span>':'External Comment';const btn=document.getElementById('rraModalSubmit');btn.textContent=title;btn.className='rraStaffBtn '+(action==='return'?'rraStaffBtnReturn':action==='approve'?'rraStaffBtnApprove':'rraStaffBtnPrimary');rraModal.classList.add('open');}
document.getElementById('rraModalClose').onclick=closeRraActionModal;document.getElementById('rraModalCancel').onclick=closeRraActionModal;
rraModal.addEventListener('click',e=>{if(e.target===rraModal)closeRraActionModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rraModal.classList.contains('open'))closeRraActionModal()});
document.getElementById('rraModalSubmit').onclick=()=>{const action=pendingRraAction;if(!action)return;const internal=document.getElementById('rraInternalComment').value.trim(),external=document.getElementById('rraExternalComment').value.trim();if(action==='return'&&!external){alert('External Comment is required when returning a request to the borrower.');return;}if(action==='supervisor'&&!document.getElementById('rraApprover').value){alert('Select a supervisor / approver.');return;}if(action==='supervisor'&&!internal){alert('Enter a review recommendation or staff comment.');return;}const titles={return:'Return to Borrower',supervisor:'Submit for Supervisor Approval',approve:'Approve (Supervisor)',deny:'Deny (Supervisor)'},statuses={return:'Returned to Borrower',supervisor:'Pending Supervisor Approval',approve:'Approved',deny:'Denied'};flow.status=statuses[action];if(action==='supervisor'){flow.assignedStaff=document.getElementById('rraAssignedStaff').value||flow.assignedStaff||'';flow.approver=document.getElementById('rraApprover').value;flow.recommendation=internal;}if(internal)flow.latestComment=internal;else if(external)flow.latestComment=external;flow.history.push({when:new Date().toLocaleString(),action:titles[action],by:action==='approve'||action==='deny'?(flow.approver||'Supervisor'):(flow.assignedStaff||'LAHD Staff'),comment:[internal&&'Internal: '+internal,external&&'External: '+external].filter(Boolean).join(' | ')});persist();closeRraActionModal();editing=false;render()};
ensureDocUi();document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;const titles={return:'Return to Borrower',supervisor:'Submit for Supervisor Approval',approve:'Approve (Supervisor)',deny:'Deny (Supervisor)'};if((action==='approve'||action==='deny')&&flow.status!=='Pending Supervisor Approval'){alert('Submit the request for supervisor approval before recording a supervisor decision.');return}openRraActionModal(action,titles[action])});render()})();
// v177.8: consistent top-level tab navigation, intercept legacy step-only handlers.
function rraNavigateTab(which){
 ensureDocUi();docOverlay.classList.remove('open');
 document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
 if(which==='documents'){
  document.getElementById('documentsTab').classList.add('active');
  document.querySelector('.layout').style.display='none';docWorkspace.style.display='block';paintDocWorkspace();return;
 }
 docWorkspace.style.display='none';document.querySelector('.layout').style.display='grid';
 editing=false;showActivity=(which==='activity');
 document.getElementById(which==='activity'?'activityTab':'requestDetailsTab').classList.add('active');
 render();
}
[['requestDetailsTab','details'],['documentsTab','documents'],['activityTab','activity']].forEach(([id,which])=>{
 document.getElementById(id).addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();rraNavigateTab(which)},true);
});
// Keep the navigation state synchronized when a review step is selected.
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
 if(docWorkspace&&docWorkspace.style.display!=='none')rraNavigateTab('details');
},true));
