<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LAHD | RRA Dispute Staff Review</title><style>:root{font-family:Arial,sans-serif;color:#20384f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:white;padding:22px 30px;font-weight:700;font-size:22px}.nav{background:#173f68;color:white;padding:13px 25px}.nav a{color:white;text-decoration:none;margin-right:22px;font-size:13px}.wrap{max-width:1450px;margin:25px auto;padding:0 20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;background:#e7f0fc;border:1px solid #b9cfe7;border-top:5px solid #2962a8;border-radius:7px;padding:24px}.lbl{color:#66798b;font-size:12px;margin-bottom:7px}.val{font-weight:700}.tabs{margin:20px 0;padding:14px;background:#edf1f5;border:1px solid #d0dbe6;border-radius:6px;display:flex;gap:10px}.tab{background:#fff;border:1px solid #c6d5e5;border-radius:5px;padding:12px 22px;font-weight:700}.tab.active{background:#16548b;color:white}.layout{display:grid;grid-template-columns:270px 1fr;gap:22px}.side,.main{background:white;border:1px solid #d2dfe9;border-radius:9px;padding:25px}.side button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #d3dce7;background:#f6f8fb;border-radius:5px;cursor:pointer}.side button.active{background:#e7f0fc;border:2px solid #1767b8}.main h2{margin:0 0 22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:1px solid #cbd8e6;border-radius:8px;padding:20px;min-width:0}.card h3{margin:0 0 18px}.field{margin:12px 0;line-height:1.5;overflow-wrap:anywhere}.field span{color:#63768a;margin-right:8px}.full{margin-top:20px}.desc{background:#f0f5fa;border:1px solid #cbd9e7;padding:15px;border-radius:6px;white-space:pre-wrap}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.footer button{border:1px solid #b5c8dc;background:white;border-radius:5px;padding:12px 17px;font-weight:bold;cursor:pointer}.footer button.primary{background:#15548b;color:white}.muted{color:#64788b;font-size:12px}.docrow{display:flex;justify-content:space-between;gap:12px;border:1px solid #d5e1ed;padding:12px;margin:8px 0;border-radius:5px}.hidden{display:none!important}textarea{width:100%;min-height:95px;border:1px solid #cbd5e1;padding:12px;font:inherit}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.layout,.cards{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="staff-dashboard.html">← Staff Dashboard</a><a href="borrower-portal.html">Borrower Dashboard</a></nav><div class="top">Analyst Requests Workspace</div><div class="wrap"><div class="summary"><div><div class="lbl">REQUEST ID</div><div class="val" id="id"></div></div><div><div class="lbl">REQUEST TYPE</div><div class="val">RRA Invoice Dispute</div></div><div><div class="lbl">PROJECT NAME</div><div class="val" id="project"></div></div><div><div class="lbl">LOAN #</div><div class="val" id="loan"></div></div></div><div class="tabs"><button class="tab active" type="button">Request Details</button><button class="tab" type="button" id="documentsTab">Documents</button><button class="tab" type="button" id="activityTab">Activity Log</button></div><div class="layout"><aside class="side"><h2>Review Steps</h2><button class="active" data-step="0">1. Request Information</button><button data-step="1">2. Project / Loan Info</button><button data-step="2">3. RRA Dispute</button><button data-step="3">4. Submitted Documents</button><button data-step="4">5. Staff Review</button></aside><main class="main"><h2 id="stepTitle"></h2><div id="content"></div><div class="footer"><button id="back" type="button">Previous</button><button class="primary" id="next" type="button">Save &amp; Continue →</button></div></main></div></div><script>(function(){'use strict';const id=new URLSearchParams(location.search).get('requestId')||'RRA-260101';let rec=null;try{const sample=JSON.parse(sessionStorage.getItem('lahdRraSample')||'null');const arr=JSON.parse(sessionStorage.getItem('lahdRraPrototypeRequests')||'[]');rec=[sample,...arr].find(x=>x&&x.id===id)}catch(e){}if(!rec&&id==='RRA-260101')rec={id:'RRA-260101',project:'Arlington Square',loan:'14-121637-001',requester:'Maria Hernandez',organization:'Arlington Housing LLC',email:'maria@example.org',invoice:'RRA-INV-2026-0142',year:'2025',received:'2026-10-10',description:'Disputed operating expense adjustment in the 2025 residual receipt analysis.',status:'Submitted',created:'2026-10-15T10:00:00',sample:true};if(!rec){document.querySelector('.main').textContent='Request not found in this browser session. Return to the Staff Dashboard and select a request.';return;}const $=id=>document.getElementById(id);function set(id,value){$(id).textContent=value||'Not supplied'}set('id',rec.id);set('project',rec.project);set('loan',rec.loan);const headings=['Step 1 - Request Information','Step 2 - Project / Loan Info','Step 3 - RRA Invoice Dispute','Step 4 - Submitted Documents','Step 5 - Staff Review'];let step=0;function node(tag,text,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e}function field(host,label,value){const e=node('div','', 'field');e.append(node('span',label+':'),node('strong',value||'Not supplied'));host.append(e)}function card(title){const e=node('section','', 'card');e.append(node('h3',title));return e}function render(){document.querySelectorAll('[data-step]').forEach((b,i)=>b.classList.toggle('active',i===step));$('stepTitle').textContent=headings[step];const host=$('content');host.replaceChildren();if(step===0){const grid=node('div','','cards');const a=card('Summary of the Request');field(a,'Request #',rec.id);field(a,'Submitted',rec.created?new Date(rec.created).toLocaleDateString('en-US'):'Not supplied');field(a,'Status',rec.status||'Submitted');const b=card('Requester Information');field(b,'Name',rec.requester);field(b,'Organization',rec.organization);field(b,'Phone',rec.phone);field(b,'Email',rec.email);grid.append(a,b);host.append(grid)}if(step===1){const a=card('Project / Loan Association');field(a,'Loan #',rec.loan);field(a,'Project',rec.project);field(a,'Address',rec.address);host.append(a)}if(step===2){const a=card('Disputed RRA Invoice');field(a,'Invoice #',rec.invoice);field(a,'RRA Financial Year',rec.year);field(a,'Invoice Date',rec.invoiceDate);field(a,'Invoice Receipt Date',rec.received);host.append(a);host.append(node('h3','Description of Dispute','full'),node('div',rec.description||'Not supplied','desc'))}if(step===3){host.append(node('p',rec.sample?'Sample demonstration request. Document attachments are illustrative and not available for download.':'Uploaded file names are shown for demonstration; file contents are not stored in the prototype.','muted'));const docs=rec.documents||[];if(!docs.length)host.append(node('p','No uploaded document metadata available for this sample.'));docs.forEach(d=>{const row=node('div','','docrow');row.append(node('strong',d.category),node('span',(d.files||[]).join(', ')||'Not supplied'));host.append(row)})}if(step===4){host.append(node('p','Staff review notes (prototype only).'));const t=document.createElement('textarea');t.placeholder='Record review findings, calculation concerns, or documents needed';t.value=sessionStorage.getItem('lahdRraNotes:'+rec.id)||'';t.addEventListener('input',()=>sessionStorage.setItem('lahdRraNotes:'+rec.id,t.value));host.append(t);host.append(node('p','No accounting invoice adjustments or approval actions are executed by this demonstration.','muted'))}$('back').disabled=step===0;$('next').textContent=step===4?'Return to Queue':'Save & Continue →'}document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.step;render()}));$('back').addEventListener('click',()=>{step=Math.max(0,step-1);render()});$('next').addEventListener('click',()=>{if(step===4)location.assign('staff-dashboard.html');else{step++;render()}});$('documentsTab').addEventListener('click',()=>{step=3;render()});$('activityTab').addEventListener('click',()=>{step=4;render()});render()})();</script></body></html>
