<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LAHD | RRA Dispute Staff Review</title><style>:root{font-family:Arial,sans-serif;color:#20384f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:white;padding:22px 30px;font-weight:700;font-size:22px}.nav{background:#173f68;color:white;padding:13px 25px}.nav a{color:white;text-decoration:none;margin-right:22px;font-size:13px}.wrap{max-width:1450px;margin:25px auto;padding:0 20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;background:#e7f0fc;border:1px solid #b9cfe7;border-top:5px solid #2962a8;border-radius:7px;padding:24px}.lbl{color:#66798b;font-size:12px;margin-bottom:7px}.val{font-weight:700}.tabs{margin:20px 0;padding:14px;background:#edf1f5;border:1px solid #d0dbe6;border-radius:6px;display:flex;gap:10px}.tab{background:#fff;border:1px solid #c6d5e5;border-radius:5px;padding:12px 22px;font-weight:700}.tab.active{background:#16548b;color:white}.layout{display:grid;grid-template-columns:270px 1fr;gap:22px}.side,.main{background:white;border:1px solid #d2dfe9;border-radius:9px;padding:25px}.side button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #d3dce7;background:#f6f8fb;border-radius:5px;cursor:pointer}.side button.active{background:#e7f0fc;border:2px solid #1767b8}.main h2{margin:0 0 22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:1px solid #cbd8e6;border-radius:8px;padding:20px;min-width:0}.card h3{margin:0 0 18px}.field{margin:12px 0;line-height:1.5;overflow-wrap:anywhere}.field span{color:#63768a;margin-right:8px}.full{margin-top:20px}.desc{background:#f0f5fa;border:1px solid #cbd9e7;padding:15px;border-radius:6px;white-space:pre-wrap}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.footer button{border:1px solid #b5c8dc;background:white;border-radius:5px;padding:12px 17px;font-weight:bold;cursor:pointer}.footer button.primary{background:#15548b;color:white}.muted{color:#64788b;font-size:12px}.docrow{display:flex;justify-content:space-between;gap:12px;border:1px solid #d5e1ed;padding:12px;margin:8px 0;border-radius:5px}.hidden{display:none!important}textarea{width:100%;min-height:95px;border:1px solid #cbd5e1;padding:12px;font:inherit}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.layout,.cards{grid-template-columns:1fr}}</style><style>.actionbar{margin-left:auto;position:relative}.actionbar>button,.editbtn{background:#15548b;color:white;border:0;border-radius:5px;padding:11px 16px;font-weight:bold;cursor:pointer}.actionmenu{position:absolute;right:0;top:43px;z-index:5;background:white;border:1px solid #cad7e5;box-shadow:0 5px 20px #0002;min-width:250px;border-radius:6px;padding:5px}.actionmenu button{display:block;width:100%;background:white;border:0;text-align:left;padding:12px;cursor:pointer}.actionmenu button:hover{background:#eaf2fc}.edithead{display:flex;justify-content:space-between;align-items:center}.editfield{display:grid;grid-template-columns:180px 1fr;gap:10px;margin:10px 0;align-items:center}.editfield input,.editfield textarea{width:100%;border:1px solid #b9cadd;border-radius:4px;padding:9px;font:inherit}.editbuttons{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.editbuttons button{padding:9px 15px;cursor:pointer}.notice{background:#eff6ff;border:1px solid #bfd3ec;padding:12px;margin:15px 0;border-radius:5px}.statuspill{display:inline-block;border-radius:20px;background:#dbeafe;padding:6px 12px;font-weight:700}.activityrow{padding:10px;border-bottom:1px solid #dbe3eb}</style><style>/* Match Reserve Withdrawal staff workflow dialog */
.rraModalBackdrop{display:none;position:fixed;inset:0;background:rgba(14,31,53,.42);z-index:5000;align-items:center;justify-content:center;padding:24px}
.rraModalBackdrop.open{display:flex}.rraStaffModal{width:min(650px,96vw);background:#fff;border-radius:10px;box-shadow:0 20px 55px rgba(0,0,0,.25);font-family:Arial;color:#132946}

.actionmenu{min-width:230px;border-radius:8px;box-shadow:0 8px 24px rgba(25,49,80,.16);padding:0;overflow:hidden}.actionmenu button{padding:13px 16px;border-bottom:1px solid #e7edf5;font:600 14px Arial;color:#15304f}.actionmenu button:last-child{border-bottom:0}.actionmenu button[data-action=return]{color:#a33a28}.actionmenu button[data-action=approve]{color:#146c43}
.rraStaffSelect{width:100%;padding:10px;border:1px solid #bdcada;border-radius:6px;background:white;font:14px Arial}.rraStaffField select{max-width:100%}</style></head><body><nav class="nav"><a href="staff-dashboard.html">← Staff Dashboard</a><a href="borrower-portal.html">Borrower Dashboard</a></nav><div class="top">Analyst Requests Workspace</div><div class="wrap"><div class="summary"><div><div class="lbl">REQUEST ID</div><div class="val" id="id"></div></div><div><div class="lbl">REQUEST TYPE</div><div class="val">RRA Invoice Dispute</div></div><div><div class="lbl">PROJECT NAME</div><div class="val" id="project"></div></div><div><div class="lbl">LOAN #</div><div class="val" id="loan"></div></div></div><div class="tabs"><button class="tab active" type="button">Request Details</button><button class="tab" type="button" id="documentsTab">Documents</button><button class="tab" type="button" id="activityTab">Activity Log</button><div class="actionbar"><button type="button" id="actionToggle">☰ Action Menu ▾</button><div id="actionMenu" class="actionmenu hidden"><button data-action="return">Return to Borrower</button><button data-action="supervisor">Submit for Supervisor Approval</button><button data-action="approve">Approve (Supervisor)</button><button data-action="deny">Deny (Supervisor)</button></div></div></div><div class="layout"><aside class="side"><h2>Review Steps</h2><button class="active" data-step="0">1. Request Information</button><button data-step="1">2. Project / Loan Info</button><button data-step="2">3. RRA Dispute</button><button data-step="3">4. Submitted Documents</button><button data-step="4">5. Staff Review</button></aside><main class="main"><div class="edithead"><h2 id="stepTitle"></h2><button class="editbtn hidden" id="editStep" type="button">Edit</button></div><div id="workflowStatus" class="notice"></div><div id="content"></div><div class="footer"><button id="back" type="button">Previous</button><button class="primary" id="next" type="button">Save &amp; Continue →</button></div></main></div></div><div class="rraModalBackdrop" id="rraActionModal" role="dialog" aria-modal="true" aria-labelledby="rraModalTitle"><div class="rraStaffModal"><div class="rraModalHeader"><h3 id="rraModalTitle">Workflow Action</h3><button class="rraModalClose" type="button" id="rraModalClose" aria-label="Close">×</button></div><div class="rraModalBody"><div class="rraStaffField" id="rraAssignmentField"><label for="rraAssignedStaff">Assigned Reviewer</label><select id="rraAssignedStaff" class="rraStaffSelect"><option value="">Unassigned</option><option>Steven Brady</option><option>Maria Hernandez</option><option>Tan B</option></select></div><div class="rraStaffField" id="rraApproverField"><label for="rraApprover">Submit To / Approver</label><select id="rraApprover" class="rraStaffSelect"><option value="">Select supervisor</option><option>Greg (Supervisor)</option><option>FDO II Supervisor</option></select></div><div class="rraStaffField"><label for="rraInternalComment">Internal Comment</label><textarea id="rraInternalComment" placeholder="Staff-only comment..."></textarea><div class="rraStaffHelp">Visible to authorized LAHD staff only.</div></div><div class="rraStaffField" id="rraExternalField"><label for="rraExternalComment" id="rraExternalLabel">External Comment</label><textarea id="rraExternalComment" placeholder="Comment visible to the submitter..."></textarea><div class="rraStaffHelp">If entered, this comment is visible to the submitter in the Borrower Portal.</div></div></div><div class="rraModalFooter"><button type="button" class="rraStaffBtn" id="rraModalCancel">Cancel</button><button type="button" class="rraStaffBtn rraStaffBtnPrimary" id="rraModalSubmit">Submit</button></div></div></div><script>(function(){'use strict';const id=new URLSearchParams(location.search).get('requestId')||'RRA-260101';let rec=null;try{const sample=JSON.parse(sessionStorage.getItem('lahdRraSample')||'null');const arr=JSON.parse(sessionStorage.getItem('lahdRraPrototypeRequests')||'[]');rec=[sample,...arr].find(x=>x&&x.id===id)}catch(e){}if(!rec&&id==='RRA-260101')rec={id:'RRA-260101',project:'Arlington Square',loan:'14-121637-001',requester:'Maria Hernandez',organization:'Arlington Housing LLC',email:'maria@example.org',invoice:'RRA-INV-2026-0142',year:'2025',received:'2026-10-10',description:'Disputed operating expense adjustment in the 2025 residual receipt analysis.',status:'Submitted',created:'2026-10-15T10:00:00',sample:true};if(!rec){document.querySelector('.main').textContent='Request not found in this browser session. Return to the Staff Dashboard and select a request.';return;}const $=id=>document.getElementById(id);function set(id,value){$(id).textContent=value||'Not supplied'}set('id',rec.id);set('project',rec.project);set('loan',rec.loan);const headings=['Step 1 - Request Information','Step 2 - Project / Loan Info','Step 3 - RRA Invoice Dispute','Step 4 - Submitted Documents','Step 5 - Staff Review'];let step=0;function node(tag,text,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e}function field(host,label,value){const e=node('div','', 'field');e.append(node('span',label+':'),node('strong',value||'Not supplied'));host.append(e)}function card(title){const e=node('section','', 'card');e.append(node('h3',title));return e}function render(){document.querySelectorAll('[data-step]').forEach((b,i)=>b.classList.toggle('active',i===step));$('stepTitle').textContent=headings[step];const host=$('content');host.replaceChildren();if(step===0){const grid=node('div','','cards');const a=card('Summary of the Request');field(a,'Request #',rec.id);field(a,'Submitted',rec.created?new Date(rec.created).toLocaleDateString('en-US'):'Not supplied');field(a,'Status',rec.status||'Submitted');const b=card('Requester Information');field(b,'Name',rec.requester);field(b,'Organization',rec.organization);field(b,'Phone',rec.phone);field(b,'Email',rec.email);grid.append(a,b);host.append(grid)}if(step===1){const a=card('Project / Loan Association');field(a,'Loan #',rec.loan);field(a,'Project',rec.project);field(a,'Address',rec.address);host.append(a)}if(step===2){const a=card('Disputed RRA Invoice');field(a,'Invoice #',rec.invoice);field(a,'RRA Financial Year',rec.year);field(a,'Invoice Date',rec.invoiceDate);field(a,'Invoice Receipt Date',rec.received);host.append(a);host.append(node('h3','Description of Dispute','full'),node('div',rec.description||'Not supplied','desc'))}if(step===3){host.append(node('p',rec.sample?'Sample demonstration request. Document attachments are illustrative and not available for download.':'Uploaded file names are shown for demonstration; file contents are not stored in the prototype.','muted'));const docs=rec.documents||[];if(!docs.length)host.append(node('p','No uploaded document metadata available for this sample.'));docs.forEach(d=>{const row=node('div','','docrow');row.append(node('strong',d.category),node('span',(d.files||[]).join(', ')||'Not supplied'));host.append(row)})}if(step===4){host.append(node('p','Staff review notes (prototype only).'));const t=document.createElement('textarea');t.placeholder='Record review findings, calculation concerns, or documents needed';t.value=sessionStorage.getItem('lahdRraNotes:'+rec.id)||'';t.addEventListener('input',()=>sessionStorage.setItem('lahdRraNotes:'+rec.id,t.value));host.append(t);const approval=card('Review and Approval Summary');field(approval,'Current Status',flow.status);field(approval,'Assigned Staff',flow.assignedStaff||'Unassigned');field(approval,'Approver',flow.approver||'Not assigned');field(approval,'Review Recommendation',flow.recommendation||'Not submitted');field(approval,'Latest Staff Comment',flow.latestComment||'—');host.append(approval);const history=card('Approval History');if(!flow.history.length)history.append(node('p','No approval actions recorded yet.','muted'));flow.history.slice().reverse().forEach(h=>history.append(node('div',h.when+' — '+h.action+(h.by?' by '+h.by:'')+(h.comment?' — '+h.comment:''),'activityrow')));host.append(history);host.append(node('p','Use the Action Menu for Submit for Approval, Approve, Deny or Return. This section displays the resulting record. No accounting invoice adjustment is executed in this prototype.','muted'))}$('back').disabled=step===0;$('next').textContent=step===4?'Return to Queue':'Save & Continue →'}document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.step;render()}));$('back').addEventListener('click',()=>{step=Math.max(0,step-1);render()});$('next').addEventListener('click',()=>{if(step===4)location.assign('staff-dashboard.html');else{step++;render()}});$('documentsTab').addEventListener('click',()=>{step=3;render()});$('activityTab').addEventListener('click',()=>{step=4;render()});const edits={0:['requester','organization','phone','email'],1:['loan','project','address'],2:['invoice','year','invoiceDate','received','description']};const labels={requester:'Requester Name',organization:'Borrower / Organization',phone:'Phone',email:'Email',loan:'Loan Number',project:'Project / Property Name',address:'Property Address',invoice:'Invoice Number',year:'RRA Financial Year',invoiceDate:'Invoice Date',received:'Invoice Receipt Date',description:'Description of Dispute'};let editing=false;let showActivity=false;const editStore='lahdRraStaffEdits:'+rec.id,flowStore='lahdRraStaffFlow:'+rec.id;try{Object.assign(rec,JSON.parse(sessionStorage.getItem(editStore)||'{}'))}catch(e){}let flow={status:rec.status||'Submitted',history:[]};try{flow=Object.assign(flow,JSON.parse(sessionStorage.getItem(flowStore)||'{}'))}catch(e){}function persist(){sessionStorage.setItem(editStore,JSON.stringify(Object.fromEntries(Object.keys(labels).map(k=>[k,rec[k]]))));sessionStorage.setItem(flowStore,JSON.stringify(flow));try{let arr=JSON.parse(sessionStorage.getItem('lahdRraPrototypeRequests')||'[]');arr=arr.map(r=>r.id===rec.id?{...r,...rec,status:flow.status}:r);sessionStorage.setItem('lahdRraPrototypeRequests',JSON.stringify(arr))}catch(e){}}function status(){document.getElementById('workflowStatus').innerHTML='<strong>Status:</strong> <span class="statuspill"></span>';document.querySelector('#workflowStatus .statuspill').textContent=flow.status}function paintEditor(){const btn=document.getElementById('editStep');btn.classList.toggle('hidden',showActivity||!edits[step]);btn.textContent=editing?'Cancel Edit':'Edit';status();if(showActivity){document.getElementById('stepTitle').textContent='Activity Log';const host=document.getElementById('content');host.replaceChildren();if(!flow.history.length)host.append(node('p','No staff workflow actions recorded yet.','muted'));flow.history.slice().reverse().forEach(x=>host.append(node('div',x.when+' — '+x.action+(x.comment?' — '+x.comment:''),'activityrow')));btn.classList.add('hidden');return}if(!editing)return;const host=document.getElementById('content');host.replaceChildren();const form=document.createElement('form');form.id='rraEditForm';edits[step].forEach(key=>{const row=node('div','','editfield');const lab=node('label',labels[key]);lab.htmlFor='rra_'+key;const inp=document.createElement(key==='description'?'textarea':'input');inp.id='rra_'+key;inp.name=key;inp.value=rec[key]||'';row.append(lab,inp);form.append(row)});const buttons=node('div','','editbuttons');const cancel=node('button','Cancel');cancel.type='button';cancel.onclick=()=>{editing=false;render();paintEditor()};const save=node('button','Save Changes');save.type='submit';buttons.append(cancel,save);form.append(buttons);form.onsubmit=e=>{e.preventDefault();new FormData(form).forEach((v,k)=>rec[k]=String(v).trim());persist();editing=false;set('project',rec.project);set('loan',rec.loan);render();paintEditor()};host.append(form)}const originalRender=render;render=function(){originalRender();paintEditor()};document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{editing=false;showActivity=false;render()}));document.getElementById('back').addEventListener('click',()=>{editing=false;showActivity=false;render()});document.getElementById('next').addEventListener('click',()=>{editing=false;showActivity=false;render()});document.getElementById('documentsTab').addEventListener('click',()=>{editing=false;showActivity=false;render()});document.getElementById('activityTab').addEventListener('click',()=>{editing=false;showActivity=true;render()});document.getElementById('editStep').onclick=()=>{editing=!editing;render()};document.getElementById('actionToggle').onclick=()=>document.getElementById('actionMenu').classList.toggle('hidden');let pendingRraAction=null;
const rraModal=document.getElementById('rraActionModal');
function closeRraActionModal(){rraModal.classList.remove('open');pendingRraAction=null;}
function openRraActionModal(action,title){pendingRraAction=action;document.getElementById('actionMenu').classList.add('hidden');document.getElementById('rraModalTitle').textContent=title;document.getElementById('rraInternalComment').value='';document.getElementById('rraExternalComment').value='';const ext=document.getElementById('rraExternalField');ext.style.display=action==='supervisor'?'none':'block';document.getElementById('rraApproverField').style.display=action==='supervisor'?'block':'none';document.getElementById('rraAssignmentField').style.display=action==='supervisor'?'block':'none';document.getElementById('rraAssignedStaff').value=flow.assignedStaff||'';document.getElementById('rraApprover').value=flow.approver||'';document.getElementById('rraExternalLabel').innerHTML=action==='return'?'External Comment <span class="rraRequired">*</span>':'External Comment';const btn=document.getElementById('rraModalSubmit');btn.textContent=title;btn.className='rraStaffBtn '+(action==='return'?'rraStaffBtnReturn':action==='approve'?'rraStaffBtnApprove':'rraStaffBtnPrimary');rraModal.classList.add('open');}
document.getElementById('rraModalClose').onclick=closeRraActionModal;document.getElementById('rraModalCancel').onclick=closeRraActionModal;
rraModal.addEventListener('click',e=>{if(e.target===rraModal)closeRraActionModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rraModal.classList.contains('open'))closeRraActionModal()});
document.getElementById('rraModalSubmit').onclick=()=>{const action=pendingRraAction;if(!action)return;const internal=document.getElementById('rraInternalComment').value.trim(),external=document.getElementById('rraExternalComment').value.trim();if(action==='return'&&!external){alert('External Comment is required when returning a request to the borrower.');return;}if(action==='supervisor'&&!document.getElementById('rraApprover').value){alert('Select a supervisor / approver.');return;}if(action==='supervisor'&&!internal){alert('Enter a review recommendation or staff comment.');return;}const titles={return:'Return to Borrower',supervisor:'Submit for Supervisor Approval',approve:'Approve (Supervisor)',deny:'Deny (Supervisor)'},statuses={return:'Returned to Borrower',supervisor:'Pending Supervisor Approval',approve:'Approved',deny:'Denied'};flow.status=statuses[action];if(action==='supervisor'){flow.assignedStaff=document.getElementById('rraAssignedStaff').value||flow.assignedStaff||'';flow.approver=document.getElementById('rraApprover').value;flow.recommendation=internal;}if(internal)flow.latestComment=internal;else if(external)flow.latestComment=external;flow.history.push({when:new Date().toLocaleString(),action:titles[action],by:action==='approve'||action==='deny'?(flow.approver||'Supervisor'):(flow.assignedStaff||'LAHD Staff'),comment:[internal&&'Internal: '+internal,external&&'External: '+external].filter(Boolean).join(' | ')});persist();closeRraActionModal();editing=false;render()};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;const titles={return:'Return to Borrower',supervisor:'Submit for Supervisor Approval',approve:'Approve (Supervisor)',deny:'Deny (Supervisor)'};if((action==='approve'||action==='deny')&&flow.status!=='Pending Supervisor Approval'){alert('Submit the request for supervisor approval before recording a supervisor decision.');return}openRraActionModal(action,titles[action])});render()})();</script></body></html>
